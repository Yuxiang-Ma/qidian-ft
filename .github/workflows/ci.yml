name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        if: runner.os != 'Linux'
        run: pytest -q
      - name: Tests (virtual display, so the GUI test runs too)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a pytest -q -rs

  bare-install:
    name: bare install has no numpy/matplotlib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install without extras
        run: pip install -e .
      - name: Core API imports
        run: >
          python -c "import sys, qidian_ft as q;
          assert 'numpy' not in sys.modules and 'matplotlib' not in sys.modules;
          [getattr(q, n) for n in ('FTSensor', 'Recorder', 'SensorConfig', 'open_backend')];
          print('ok', q.describe_platform())"
